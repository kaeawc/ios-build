# XcodeGen spec for the app shells. The .xcodeproj is generated (`bash scripts/ios/xcodegen-generate.sh`)
# and never committed, so there are no project-file merge conflicts. Build settings live in
# Configurations/*.xcconfig; app code lives in the local Swift package at ../Modules.
name: StarterApp

options:
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  # Only per-target platform defaults (SDKROOT, TARGETED_DEVICE_FAMILY, runpath search paths, ...)
  # come from XcodeGen; project-wide settings come from the xcconfig files below.
  settingPresets: targets

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

packages:
  Modules:
    path: ../Modules

targets:
  StarterApp:
    type: application
    # One target for iPhone and iPad (iOS), Apple TV (tvOS) and Apple Vision Pro (visionOS).
    supportedDestinations: [iOS, tvOS, visionOS]
    configFiles:
      Debug: Configurations/App.xcconfig
      Release: Configurations/App.xcconfig
    sources:
      - path: App
    dependencies:
      - package: Modules
        product: AppFeature
      # Ship the watch app inside the iOS app.
      - target: StarterAppWatch
        destinationFilters: [iOS]

  StarterAppWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Configurations/Watch.xcconfig
      Release: Configurations/Watch.xcconfig
    sources:
      - path: Watch
    dependencies:
      - package: Modules
        product: AppFeature

  StarterAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS, visionOS]
    configFiles:
      Debug: Configurations/UITests.xcconfig
      Release: Configurations/UITests.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: StarterApp

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - StarterApp
        - package: Modules/AppFeature
        - package: Modules/Connectivity
        - package: Modules/Persistence
      targets:
        # Unit tests (Swift Testing) for every module in ../Modules. Add new test targets here.
        - package: Modules/AppFeatureTests
        - package: Modules/ConnectivityTests
        - package: Modules/PersistenceTests
        # UI tests (XCTest) against the real app.
        - name: StarterAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  StarterAppWatch:
    build:
      targets:
        StarterAppWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Modules/AppFeatureTests
        - package: Modules/ConnectivityTests
        - package: Modules/PersistenceTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
