name: StarterApp
options:
  bundleIdPrefix: dev.jasonpearson.ios
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.9.1"
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.6.0"
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.0.0"
  XCTestRunner:
    path: ../../libs/spm/XCTestRunner

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  StarterApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "*.xcassets"
      - path: Sources/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.ios.StarterApp
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - package: Alamofire
      - package: SQLiteData
        product: SQLiteData
      - package: Dependencies
        product: Dependencies

  StarterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - AutoMobile/**
    dependencies:
      - target: StarterApp
      - package: Dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.ios.StarterAppTests

  StarterAppAutoMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AutoMobile
        excludes:
          - "test-plans/**"
    resources:
      - path: Tests/AutoMobile/test-plans
    dependencies:
      - target: StarterApp
      - package: XCTestRunner
        product: XCTestRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.ios.StarterAppAutoMobileTests

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
        StarterAppTests:
          - test
        StarterAppAutoMobileTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      parallelizeBuild: true
      enableCodeCoverage: false
      targets:
        - name: StarterAppTests
        - name: StarterAppAutoMobileTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
