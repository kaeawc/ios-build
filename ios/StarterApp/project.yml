name: StarterApp
options:
  bundleIdPrefix: dev.jasonpearson.ios
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.9.1"
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.6.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  StarterApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "*.xcassets"
      - path: Sources/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.ios.StarterApp
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Alamofire
      - package: SQLiteData
        product: SQLiteData

  StarterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StarterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.ios.StarterAppTests

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
        StarterAppTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      parallelizeBuild: true
      enableCodeCoverage: false
      targets:
        - name: StarterAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
