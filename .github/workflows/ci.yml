name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Xcode used for every macOS job. Bump it here (Renovate does not track Xcode); runner
  # images list what is installed: https://github.com/actions/runner-images/tree/main/images/macos
  XCODE_VERSION: "26.6"
  # mise reads tool versions from mise.toml; the token avoids GitHub API rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ===========================================================================
  # Lint (Linux: fast and cheap). Tool versions come from mise.toml.
  # ===========================================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install yamllint and xmllint
        run: sudo apt-get install -y --no-install-recommends yamllint libxml2-utils

      - name: Lint
        run: bash scripts/lint.sh

  # ===========================================================================
  # Module tests on the macOS host: `swift test` in ios/Modules, no simulator.
  # Quickest feedback on the package itself.
  # ===========================================================================

  package-tests:
    name: Package tests (macOS host)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ios/Modules/.build
          key: spm-host-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Modules/Package.swift', 'ios/Modules/Package.resolved') }}
          restore-keys: spm-host-xcode${{ env.XCODE_VERSION }}-

      - name: swift test
        working-directory: ios/Modules
        run: swift test --parallel

      # Bazel builds from the committed Package.resolved, so SwiftPM must not want to change it.
      - name: Check Package.resolved
        run: |
          git diff --exit-code ios/Modules/Package.resolved || {
            echo "::error::Package.resolved is out of date: run 'swift package resolve' in ios/Modules and commit it"
            exit 1
          }

  # ===========================================================================
  # The same module tests built and run by Bazel on the macOS host, so the
  # Bazel build (ios/Modules/BUILD.bazel) can't drift from Package.swift.
  # ===========================================================================

  bazel-host:
    name: Bazel (macOS host)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rules_swift_package_manager reads the Swift packages with the selected Xcode.
      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          # Outputs depend on the Xcode version, so it is part of the cache key.
          disk-cache: bazel-host-xcode${{ env.XCODE_VERSION }}
          repository-cache: true
          # Pull requests read the caches that main writes.
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: bazel test
        run: bazel test --config=ci --xcode_version="${XCODE_VERSION}" //ios/Modules/...

      # After the build, so a stale lockfile doesn't hide test results.
      - name: Check MODULE.bazel.lock
        if: success() || failure()
        run: |
          bazel mod deps --lockfile_mode=update > /dev/null
          [[ -z "$(git status --porcelain MODULE.bazel.lock)" ]] || {
            echo "::error::MODULE.bazel.lock is out of date: run 'bazel mod deps' and commit it"
            exit 1
          }

      - name: Upload MODULE.bazel.lock
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MODULE.bazel.lock
          path: MODULE.bazel.lock
          retention-days: 7

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-testlogs-host
          path: bazel-testlogs/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Bazel: build every app, then run the module and UI tests on the iPhone and
  # iPad simulators. tvOS, visionOS and watchOS tests stay on xcodebuild (the
  # Test job below): rules_apple has no working test runner for them yet.
  # ===========================================================================

  bazel-apps:
    name: Bazel build (all apps)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-apps-xcode${{ env.XCODE_VERSION }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # The iOS app embeds the watch app; the watch app is also built on its own.
      - name: Build (Debug, simulators)
        run: |
          bazel build --config=ci --xcode_version="${XCODE_VERSION}" \
            //ios/StarterApp:StarterApp \
            //ios/StarterApp:StarterAppWatch \
            //ios/StarterApp:StarterApp_tvOS \
            //ios/StarterApp:StarterApp_visionOS

      - name: Build iOS (Release)
        run: bazel build --config=ci --xcode_version="${XCODE_VERSION}" -c opt //ios/StarterApp:StarterApp

  bazel-test:
    name: Bazel test (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-test-xcode${{ env.XCODE_VERSION }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && matrix.device == 'iPhone' }}

      # Module tests (Swift Testing) and UI tests (XCTest) tagged for this device's simulator.
      - name: bazel test
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          tag=$(echo "$DEVICE" | tr '[:upper:]' '[:lower:]')
          bazel test --config=ci --xcode_version="${XCODE_VERSION}" \
            --test_tag_filters="$tag" --build_tests_only --nozip_undeclared_test_outputs \
            //ios/...

      # Screenshots the UI tests attach (one per screen), handy for reviewing UI changes.
      - name: Export screenshots
        if: always()
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          result="bazel-testlogs/ios/StarterApp/StarterAppUITests_${DEVICE}/test.outputs/tests.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "build/screenshots/$DEVICE"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-bazel-${{ matrix.device }}
          path: build/screenshots/${{ matrix.device }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-testlogs-${{ matrix.device }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Build and test the app on every platform's simulator.
  #
  # Each job generates the Xcode project with XcodeGen, then runs the module
  # tests (Swift Testing) and the UI tests (XCTest) through the app scheme.
  # SwiftPM checkouts are cached per Xcode version and Package.swift.
  # ===========================================================================

  test:
    name: Test (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, iPadOS, tvOS, visionOS, watchOS]
        include:
          # On GitHub-hosted runners the visionOS simulator often exceeds XCUITest's app launch
          # timeout, so CI runs only the module tests there; run the UI tests locally.
          - platform: visionOS
            unit_tests_only: true
          # The watch app has no UI tests.
          - platform: watchOS
            unit_tests_only: true
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: jdx/mise-action@v5
        with:
          install_args: xcodegen
          cache: true

      - name: Generate Xcode project
        run: bash scripts/ios/xcodegen-generate.sh

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Modules/Package.swift', 'ios/StarterApp/project.yml') }}
          restore-keys: spm-xcode${{ env.XCODE_VERSION }}-

      - name: Pick a simulator
        id: simulator
        run: echo "id=$(bash scripts/ios/find-simulator.sh "${{ matrix.platform }}")" >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
          UNIT_TESTS_ONLY: ${{ matrix.unit_tests_only || false }}
        run: bash scripts/ios/test.sh "${{ matrix.platform }}"

      - name: Build Release
        if: matrix.platform == 'iOS'
        run: bash scripts/ios/build.sh iOS Release

      # Screenshots the UI tests attach (one per screen), handy for reviewing UI changes.
      - name: Export screenshots
        if: always() && !matrix.unit_tests_only
        run: |
          xcrun xcresulttool export attachments \
            --path "build/${{ matrix.platform }}.xcresult" \
            --output-path "build/screenshots/${{ matrix.platform }}"

      - name: Upload screenshots
        if: always() && !matrix.unit_tests_only
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.platform }}
          path: build/screenshots/${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: build/${{ matrix.platform }}.xcresult
          retention-days: 7

      - name: Upload crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-logs-${{ matrix.platform }}
          path: ~/Library/Logs/DiagnosticReports/StarterApp*
          if-no-files-found: ignore
          retention-days: 7
