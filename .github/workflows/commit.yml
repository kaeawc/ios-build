name: Commit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  # ===========================================================================
  # Static Analysis (Linux, fast)
  # ===========================================================================

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: bash scripts/shellcheck/validate_shell_scripts.sh

  validate-xml:
    name: "Validate XML"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet

      - name: Validate XML files
        run: bash scripts/xml/validate_xml.sh

  validate-yaml:
    name: "Validate YAML"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Validate YAML files
        run: bash scripts/yaml/validate_yaml.sh

  # ===========================================================================
  # Swift Code Quality (macOS)
  # These run on macos-15 only — formatting rules are Xcode-version-agnostic.
  # Caching the Homebrew download cache (~10-25 MB per tool) means `brew install`
  # extracts from local disk instead of re-downloading on every run.
  # ===========================================================================

  swiftformat:
    name: "SwiftFormat"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-swiftformat-${{ hashFiles('Brewfile') }}
          restore-keys: macos-15-homebrew-swiftformat-

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Validate SwiftFormat
        run: ONLY_TOUCHED_FILES=false bash scripts/swiftformat/validate_swiftformat.sh

  swiftlint:
    name: "SwiftLint"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-swiftlint-${{ hashFiles('Brewfile') }}
          restore-keys: macos-15-homebrew-swiftlint-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Validate SwiftLint
        run: ONLY_TOUCHED_FILES=false bash scripts/swiftlint/validate_swiftlint.sh

  # ===========================================================================
  # XcodeGen Validation (single runner, cheap pre-check before the matrix)
  # ===========================================================================

  xcodegen:
    name: "Generate Xcode Projects"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-xcodegen-${{ hashFiles('Brewfile') }}
          restore-keys: macos-15-homebrew-xcodegen-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Projects
        run: bash scripts/ios/xcodegen-generate.sh

  # ===========================================================================
  # Build for Testing (matrix: macOS 15 + 26)
  #
  # Caching strategy:
  #   - Homebrew downloads: keyed on Brewfile so a tool upgrade busts it
  #   - DerivedData intermediates: keyed on Xcode version + source/config hashes
  #     so clean rebuilds only happen when sources actually change. On a cache
  #     hit Xcode only recompiles dirty translation units — a 60s build becomes
  #     a few seconds. Restore-key fallback allows partial reuse when some files
  #     changed.
  #
  # Uploads Build/Products (app bundles + .xctestrun) as a short-lived artifact
  # so the simulator-tests matrix can test-without-building on the same binaries.
  # ===========================================================================

  build-for-testing:
    name: "Build for Testing (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: [xcodegen]
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 16 (macOS 15)", runner: "macos-15", xcode: "16" }
          - { name: "Xcode 26.2 (macOS 26)", runner: "macos-26", xcode: "26.2" }
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.config.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: Ensure iOS Simulator runtime
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ matrix.config.runner }}-homebrew-xcodegen-${{ hashFiles('Brewfile') }}
          restore-keys: ${{ matrix.config.runner }}-homebrew-xcodegen-

      - name: Install XcodeGen
        run: brew install xcodegen

      # SPM checkouts are stored under SourcePackages/ when using a custom
      # -derivedDataPath. Caching them avoids re-cloning Alamofire,
      # SQLiteData, and swift-dependencies on every run.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: ${{ matrix.config.runner }}-xcode${{ matrix.config.xcode }}-spm-${{ hashFiles('ios/**/project.yml') }}
          restore-keys: ${{ matrix.config.runner }}-xcode${{ matrix.config.xcode }}-spm-

      # Restore incremental compilation artifacts. COMPILER_INDEX_STORE_ENABLE=NO
      # and INDEX_ENABLE_DATA_STORE=NO (set in the build script) keep intermediates
      # small by skipping the index store (~40% of DerivedData size).
      - name: Cache DerivedData intermediates
        uses: actions/cache@v4
        with:
          path: build/DerivedData/Build/Intermediates.noindex
          key: ${{ matrix.config.runner }}-xcode${{ matrix.config.xcode }}-intermediates-${{ hashFiles('ios/**/*.swift', 'ios/**/project.yml', 'ios/**/*.xcconfig') }}
          restore-keys: ${{ matrix.config.runner }}-xcode${{ matrix.config.xcode }}-intermediates-

      - name: Generate Xcode Projects
        run: bash scripts/ios/xcodegen-generate.sh

      - name: Build for Testing
        run: bash scripts/ios/xcode-build-for-testing.sh

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: build-for-testing-${{ matrix.config.runner }}
          # Build/Products contains the app bundles and the .xctestrun file.
          # Intermediates are NOT uploaded — they're only needed for incremental
          # local/CI builds and are already covered by the DerivedData cache above.
          path: build/DerivedData/Build/Products/
          retention-days: 1

  # ===========================================================================
  # Simulator Tests (macOS 15 / Xcode 16)
  # Downloads the build-for-testing artifact and runs test-without-building
  # so no recompilation happens here at all.
  # ===========================================================================

  simulator-tests:
    name: "Simulator Tests (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: [build-for-testing]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 16 (macOS 15)", runner: "macos-15", xcode: "16" }
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.config.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: Ensure iOS Simulator runtime
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: Download build products
        uses: actions/download-artifact@v4
        with:
          name: build-for-testing-${{ matrix.config.runner }}
          path: build/DerivedData/Build/Products/

      - name: Boot iOS Simulator
        run: |
          DEVICE=$(bash scripts/ios/find-available-iphone.sh)
          if [[ -z "$DEVICE" ]]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator: ${DEVICE}"
          xcrun simctl boot "${DEVICE}"
          bash scripts/ios/wait-for-simulator-boot.sh "${DEVICE}"

      - name: Run simulator tests
        run: bash scripts/ios/xcode-test-without-building.sh

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.config.runner }}
          path: build/test.xcresult
          retention-days: 7

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.config.runner }}
          path: build/DerivedData/**/Logs/
          retention-days: 7

  # ===========================================================================
  # Build IPA (current branch, Release configuration)
  # Runs on every push/PR so the artifact is always available.
  # ===========================================================================

  build-ipa:
    name: "Build IPA"
    runs-on: macos-15
    needs: [xcodegen]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-xcodegen-${{ hashFiles('Brewfile') }}
          restore-keys: macos-15-homebrew-xcodegen-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: macos-15-xcode16-spm-${{ hashFiles('ios/**/project.yml') }}
          restore-keys: macos-15-xcode16-spm-

      - name: Cache DerivedData intermediates
        uses: actions/cache@v4
        with:
          path: build/DerivedData/Build/Intermediates.noindex
          key: macos-15-xcode16-release-intermediates-${{ hashFiles('ios/**/*.swift', 'ios/**/project.yml', 'ios/**/*.xcconfig') }}
          restore-keys: macos-15-xcode16-release-intermediates-

      - name: Generate Xcode Projects
        run: bash scripts/ios/xcodegen-generate.sh

      - name: Build Release
        run: bash scripts/ios/xcode-build-release.sh

      - name: Create IPA
        run: bash scripts/ios/create-ipa.sh build/StarterApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/StarterApp.ipa
          retention-days: 7

  # ===========================================================================
  # Build Base IPA (PR base SHA, Release configuration) — PRs only
  # Checks out the base commit so the comparison is apples-to-apples.
  # ===========================================================================

  build-base-ipa:
    name: "Build Base IPA"
    runs-on: macos-15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-xcodegen-${{ hashFiles('Brewfile') }}
          restore-keys: macos-15-homebrew-xcodegen-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: macos-15-xcode16-spm-${{ hashFiles('ios/**/project.yml') }}
          restore-keys: macos-15-xcode16-spm-

      - name: Cache DerivedData intermediates
        uses: actions/cache@v4
        with:
          path: build/DerivedData/Build/Intermediates.noindex
          key: macos-15-xcode16-release-intermediates-${{ hashFiles('ios/**/*.swift', 'ios/**/project.yml', 'ios/**/*.xcconfig') }}
          restore-keys: macos-15-xcode16-release-intermediates-

      - name: Generate Xcode Projects
        run: bash scripts/ios/xcodegen-generate.sh

      - name: Build Release
        run: bash scripts/ios/xcode-build-release.sh

      - name: Create IPA
        run: bash scripts/ios/create-ipa.sh build/StarterApp-base.ipa

      - name: Upload Base IPA
        uses: actions/upload-artifact@v4
        with:
          name: base-ipa
          path: build/StarterApp-base.ipa
          retention-days: 7

  # ===========================================================================
  # Diff IPA from Base — PRs only
  # Downloads both artifacts, diffs them, and posts a comment on the PR.
  # Runs on ubuntu for speed (no Xcode needed — just unzip + bash math).
  # ===========================================================================

  diff-ipa-from-base:
    name: "Diff IPA from Base"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build-ipa, build-base-ipa]
    steps:
      - uses: actions/checkout@v4

      - name: Download current IPA
        uses: actions/download-artifact@v4
        with:
          name: ipa
          path: build/

      - name: Download base IPA
        uses: actions/download-artifact@v4
        with:
          name: base-ipa
          path: build/

      - name: Diff IPAs
        run: bash scripts/ios/diff-ipa.sh build/StarterApp-base.ipa build/StarterApp.ipa build/ipa-diff.md

      - name: Upload diff report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-diff
          path: build/ipa-diff.md
          retention-days: 7

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "## IPA Diff"

      - name: Post diff to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: build/ipa-diff.md
          token: ${{ secrets.GITHUB_TOKEN }}
